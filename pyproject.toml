[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vaartix"
dynamic = ["version"]
description = "Official Python SDK for the Vaartix email API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "NAP Designs", email = "support@vaartix.com" }]
keywords = ["email", "transactional-email", "api", "india", "vaartix", "ses", "sdk", "django"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
  "Framework :: Django",
]
dependencies = []

[project.optional-dependencies]
django = ["Django>=4.2"]

[project.urls]
Homepage = "https://vaartix.com"
Documentation = "https://vaartix.com/docs/"
Source = "https://github.com/vaartix-mail/vaartix-python"
Issues = "https://github.com/vaartix-mail/vaartix-python/issues"
Changelog = "https://github.com/vaartix-mail/vaartix-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/vaartix/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
